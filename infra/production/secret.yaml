# Kubernetes Secret for production environment
# Contains sensitive configuration values
#
# IMPORTANT: This file is for REFERENCE ONLY!
# 
# In production, you MUST use a proper secret management solution:
# - HashiCorp Vault
# - AWS Secrets Manager  
# - Azure Key Vault
# - Google Secret Manager
# - External Secrets Operator
#
# NEVER commit real production secrets to git!

apiVersion: v1
kind: Secret
metadata:
  name: insurance-assistant-secrets
  namespace: production
  labels:
    app: insurance-assistant
    env: production
type: Opaque
stringData:
  # ============================================
  # PLACEHOLDER VALUES - REPLACE IN PRODUCTION!
  # ============================================
  
  # Database credentials
  # These should come from your secret manager
  POLICY_DB_PASSWORD: "REPLACE_WITH_VAULT_REFERENCE"
  CLAIMS_DB_PASSWORD: "REPLACE_WITH_VAULT_REFERENCE"
  
  # LLM API key
  # This should come from your secret manager
  LLM_API_KEY: "REPLACE_WITH_VAULT_REFERENCE"

---
