# Kubernetes Secret for staging environment
# Contains sensitive configuration values
#
# IMPORTANT: In production, use a proper secret management solution like:
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - External Secrets Operator
#
# This file is for reference only. Do NOT commit real secrets to git!

apiVersion: v1
kind: Secret
metadata:
  name: insurance-assistant-secrets
  namespace: staging
  labels:
    app: insurance-assistant
    env: staging
type: Opaque
stringData:
  # Database credentials
  # NOTE: Replace these with your actual staging credentials
  POLICY_DB_PASSWORD: "staging-policy-db-password-change-me"
  CLAIMS_DB_PASSWORD: "staging-claims-db-password-change-me"
  
  # LLM API key for staging
  # Get this from your LLM provider (OpenAI, Anthropic, etc.)
  LLM_API_KEY: "sk-staging-api-key-change-me"

---
# Note: For production use, consider using:
#
# 1. Sealed Secrets (Bitnami)
# 2. External Secrets Operator with Vault
# 3. SOPS (Secrets Operations)
#
# Example with External Secrets:
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: insurance-assistant-secrets
#   namespace: staging
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: vault-backend
#     kind: ClusterSecretStore
#   target:
#     name: insurance-assistant-secrets
#   data:
#     - secretKey: LLM_API_KEY
#       remoteRef:
#         key: secret/staging/insurance-assistant
#         property: llm_api_key
