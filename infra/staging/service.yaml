# Kubernetes Service for staging environment
# Exposes the FastAPI application within the cluster

apiVersion: v1
kind: Service
metadata:
  name: insurance-assistant
  namespace: staging
  labels:
    app: insurance-assistant
    env: staging
spec:
  type: ClusterIP
  
  selector:
    app: insurance-assistant
    env: staging
  
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

